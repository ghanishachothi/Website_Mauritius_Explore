{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1>{{ user.get_full_name|default:user.username }}</h1>
{% if profile.avatar %}<img class="avatar" src="{{ profile.avatar.url }}" alt="">{% endif %}
<p class="muted">Role: {{ profile.get_role_display }}</p>
<form method="post" enctype="multipart/form-data" class="form">{% csrf_token %}
  {{ user_form.as_p }}{{ profile_form.as_p }}
  <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
