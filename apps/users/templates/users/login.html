{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="form">{% csrf_token %}{{ form.as_p }}
  <input type="hidden" name="next" value="{{ request.GET.next }}">
  <button class="btn" type="submit">Log in</button>
</form>
<p>No account? <a href="{% url 'users:signup' %}">Create one</a></p>
{% endblock %}
